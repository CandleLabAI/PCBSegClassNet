# Fine-tune config: same model, smaller learning rate. Use with -resume so
# weights are loaded from best_seg.h5 before training continues.
# general settings
name: PCBSegClassNet
model_type: SegmentationModel

datasets:
  train:
    name: FPIC
    type: Segmentation
    data_images: ../data/segmentation/train/images/
    data_masks: ../data/segmentation/train/masks/

    img_size_h: 512
    img_size_w: 512

    # data loader
    use_shuffle: true
    batch_size: 16

  val:
    name: FPIC
    type: Segmentation
    data_images: ../data/segmentation/val/images/
    data_masks: ../data/segmentation/val/masks/

    img_size_h: 512
    img_size_w: 512

    use_shuffle: false
    batch_size: 1

# path
path:
  checkpoint_network: ../checkpoints/best_seg.h5
  log_file: ../logs/app.log

# training settings
train:
  optim:
    type: Adam
    lr: 0.00001       # 1e-5 — start where the previous run left off
    betas: [0.9, 0.9]

  callbacks:
    modelcheckpoint:
      type: ModelCheckpoint
      monitor: val_dice_coef
      mode: max
      verbose: 1
      save_best_only: true
      save_weights_only: false

    reducelronplateau:
      type: ReduceLROnPlateau
      monitor: val_loss
      mode: min
      verbose: 1
      factor: 0.1
      patience: 15
      min_lr: 0.000001   # 1e-6 — allow finer adjustments than the initial run

  num_classes: 25

  # losses
  loss:
    type: DISLoss

  # metrics
  metric:
    DICE:
      type: dice_coef
    IoU:
      type: jacard_coef

# val settings
val:
  # metrics
  metric:
    DICE:
      type: DiceCoef
    IoU:
      type: IoU
